version: 2

updates:
  # One pnpm workspace, so a single npm entry covers every app and package.
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    groups:
      # Without grouping, a workspace this size produces a wall of single-package PRs that
      # nobody reads. Patch and minor updates ride together; majors stay separate so they
      # get looked at individually.
      minor-and-patch:
        patterns: ['*']
        update-types: [minor, patch]
    ignore:
      # Next 15 changes the instrumentation hook from experimental to stable and moves
      # sentry.client.config.ts to instrumentation-client.ts. That is a deliberate migration,
      # not a dependency bump.
      - dependency-name: next
        update-types: [version-update:semver-major]
      - dependency-name: react
        update-types: [version-update:semver-major]
      - dependency-name: react-dom
        update-types: [version-update:semver-major]
      # eslint-config-next 16 targets Next 16 and cannot lead the Next migration it depends
      # on. Closed once as #18; without this it returns every Monday.
      - dependency-name: eslint-config-next
        update-types: [version-update:semver-major]
      # TypeScript 7 is the native compiler rewrite and is blocked upstream, not by taste:
      # `next build` on Next 14.2 resolves no `@/*` path aliases under it, because Next parses
      # tsconfig through the installed typescript package and 7.0 does not satisfy that path.
      # All three apps fail to build. Tested and closed as #19; reopen with the Next migration.
      - dependency-name: typescript
        update-types: [version-update:semver-major]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
