name: Secret scan

on:
  pull_request:
  push:
    branches: [main]

jobs:
  gitleaks:
    name: gitleaks
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          # Full history: a secret is usually introduced in an earlier commit of a branch,
          # not at the tip. This repository has already had a credential committed and then
          # deleted — deleting the file leaves the blob reachable, so a tip-only scan misses
          # exactly the case that matters.
          fetch-depth: 0

      # Run the pinned image directly rather than gitleaks-action, so the config and baseline
      # flags are explicit and the version cannot drift under us.
      - name: gitleaks
        run: |
          docker run --rm -v "$PWD:/repo" -w /repo zricethezav/gitleaks:v8.28.0 \
            detect \
              --config=.gitleaks.toml \
              --baseline-path=.gitleaks-baseline.json \
              --redact \
              --no-banner \
              --verbose

      # The baseline suppresses known-historical findings so this check fails only on NEW
      # secrets. That is only safe if the baseline itself cannot be quietly widened, so a PR
      # that edits it has to be looked at.
      - name: Warn when the baseline changes
        if: github.event_name == 'pull_request'
        run: |
          if git diff --name-only "origin/${{ github.base_ref }}...HEAD" | grep -qx '.gitleaks-baseline.json'; then
            echo "::warning file=.gitleaks-baseline.json::This PR modifies the gitleaks baseline. Confirm every added fingerprint is a false positive or an already-tracked historical finding — adding a real new secret here would silence this check."
          fi
